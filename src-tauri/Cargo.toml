[package]
name = "dmx-control"
version = "0.1.0"
description = "DMX Controller for live shows"
authors = ["Juliere"]
edition = "2021"

[lib]
name = "dmx_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl"] }
crossbeam-channel = "0.5"
serialport = "4"
# Art-Net node discovery: socket2 lets the scanner bind UDP 6454 with
# SO_REUSEADDR/SO_REUSEPORT (ArtPollReply is broadcast to that port),
# if-addrs enumerates interfaces so ArtPoll also goes to each subnet's
# directed broadcast. Both were already in the tree as transitive deps.
socket2 = "0.5"
if-addrs = "0.13"
# Microphone / line-in capture for the audio BPM counter (CoreAudio on
# macOS, WASAPI on Windows). The detector itself is dependency-free
# time-domain DSP — cpal only does device enumeration + capture.
cpal = "0.15"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
# Direct USB access to FTDI chips for Open DMX dongles (ElectroTAS TZ-MINI etc.).
# `vendored` builds libusb 1.0 from source and links statically — no system
# install needed. We use rusb instead of FTDI's D2XX library because on macOS
# D2XX cannot evict Apple's USB-Serial kext from the device, but libusb's
# `detach_kernel_driver` can.
rusb = { version = "0.9", features = ["vendored"] }
# Bump the output thread to a real-time priority so the kernel doesn't preempt
# it for UI re-renders or background work — a 50ms scheduler gap is enough to
# make the fixture flicker.
thread-priority = "1"
# MIDI input/output for control surfaces (Launchpad MK2, etc.). Cross-
# platform USB-class compliant; no separate driver needed.
midir = "0.10"
# Elgato Stream Deck control surface — talks USB-HID directly, no
# Stream Deck app required. Mirrors the Launchpad MK2 layout in
# `streamdeck::layout` (5×3 grid for the MK.2). Bundles its own hidapi
# but we depend on `hidapi` directly so we can hold the HidApi handle
# in a global `OnceLock` (see `streamdeck::controller::shared_hidapi`).
# The hidapi C library is a process-wide singleton — dropping the
# `HidApi` value while open `HidDevice`s exist tears down the global
# state and leaves the surviving devices in undefined territory, which
# is what was hanging the app on the second `new_hidapi()` call.
elgato-streamdeck = "0.12"
hidapi = "2"
# Image rendering for Stream Deck LCD keys (72×72 PNG generated per
# state). `image` is already a transitive dep of elgato-streamdeck, but
# we depend on it directly so we can build DynamicImages with primitive
# drawing + text. `ab_glyph` is the font rasteriser used by imageproc.
# Default features pull in jpeg + png + bmp encoders. We need at least
# jpeg because the Stream Deck OriginalV2 / Mk2 firmware expects JPEG
# tile uploads — disabling default features here was previously
# starving `set_button_image` of its encoder and may have been
# producing blocked / failing USB writes.
image = "0.25"
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
# Used to inline fixture preview images as data URLs inside their JSON
# definitions. Keeps each fixture self-contained for portability — copy
# one .json file across machines and the picture goes with it.
base64 = "0.22"
# AI scene generation: HTTP POST to Anthropic / OpenAI APIs. rustls-tls
# avoids needing a system OpenSSL on Windows. JSON feature parses the
# tool/function-call responses inline.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Tokio runtime — Tauri 2 already pulls it in but the AI commands need
# the multi-thread feature to spawn a blocking HTTP call without
# blocking the UI thread. The bridge server (axum + tungstenite) also
# wants `net`, `time`, `sync` for its socket / timer / oneshot needs.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# ---- Mobile remote bridge --------------------------------------------------
# axum hosts the REST + WS endpoints the iPhone companion connects to.
# tower-http only for the permissive CORS layer used by the LAN dashboard.
# mdns-sd advertises the service on Bonjour/Avahi so the phone can find
# the desktop without typing an IP. On Windows the Firewall typically
# prompts on first launch; the UI exposes the literal IP+port so manual
# entry is always available as a fallback.
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
mdns-sd = "0.11"
sha2 = "0.10"
rand = "0.8"
qrcodegen = "1.8"
local-ip-address = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# OS-native secrets store for the cross-machine sync PAT. Keychain on
# macOS, Credential Manager on Windows, libsecret on Linux. Falls back
# to an error (not a plaintext file) so a missing secret store never
# silently exposes the token.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
hex-literal = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
