  <circle cx="512" cy="260" r="180" fill="#0E1224" stroke="url(#ring)" stroke-width="18"/>

  <circle cx="512" cy="180" r="115" fill="url(#halo)"/>
  <circle cx="438" cy="312" r="115" fill="url(#halo)"/>
  <circle cx="586" cy="312" r="115" fill="url(#halo)"/>

  <circle cx="512" cy="180" r="44" fill="url(#pinShine)" stroke="#FFC83A" stroke-width="3"/>
  <circle cx="438" cy="312" r="44" fill="url(#pinShine)" stroke="#FFC83A" stroke-width="3"/>
  <circle cx="586" cy="312" r="44" fill="url(#pinShine)" stroke="#FFC83A" stroke-width="3"/>

  <rect x="232" y="640" width="140" height="260" rx="18" ry="18" fill="url(#barL)"/>
  <rect x="442" y="500" width="140" height="400" rx="18" ry="18" fill="url(#barC)"/>
  <rect x="652" y="700" width="140" height="200" rx="18" ry="18" fill="url(#barR)"/>

  <rect x="222" y="900" width="580" height="6" rx="3" fill="#3D4870"/>
