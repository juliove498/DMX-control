<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1F35"/>
      <stop offset="100%" stop-color="#0A0E1F"/>
    </linearGradient>
    <linearGradient id="barL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22E0FF"/>
      <stop offset="100%" stop-color="#0E5DAB"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6BE0"/>
      <stop offset="100%" stop-color="#7A1BB5"/>
    </linearGradient>
    <linearGradient id="barR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB14B"/>
      <stop offset="100%" stop-color="#B8480D"/>
    </linearGradient>
    <radialGradient id="pinShine" cx="38%" cy="32%" r="70%">
